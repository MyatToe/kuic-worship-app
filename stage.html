<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hangeul.pstatic.net https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://hangeul.pstatic.net; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KUIC Worship — Stage display</title>
  <meta name="author" content="Myat Toe (Matthew)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
  <style>
    /* Copyright (c) 2026 Myat Toe (Matthew). All rights reserved. */
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
    body { font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; gap: 2vw; padding: 1.2vh 2vw; background: #111; font-size: 2.6vh; }
    header .title { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .label { color: #ffd166; font-weight: 700; }
    .clock { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 4vh; }
    .timer { font-variant-numeric: tabular-nums; color: #9ad1ff; }
    main { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2vw; padding: 2vh 2vw; min-height: 0; }
    .now, .next { min-height: 0; display: flex; flex-direction: column; }
    .now .lines { font-size: 6.2vh; font-weight: 800; line-height: 1.25; }
    .now .lines2 { font-size: 6.2vh; font-weight: 800; margin-top: 1.2vh; line-height: 1.25; }
    .next { border-left: 2px solid #333; padding-left: 2vw; color: #9a9a9a; }
    .next h2, .now h2 { margin: 0 0 1vh; font-size: 2.2vh; letter-spacing: 0.1em; text-transform: uppercase; color: #777; }
    .next .lines { font-size: 3.6vh; line-height: 1.3; }
    .blank { color: #ef5350; font-weight: 700; }
    /* Chord-only songs: the chord chart instead of lyrics */
    .now .lines:has(.chart) { overflow: auto; min-height: 0; }
    .now .lines .chart-title { font-size: 3.4vh; margin-bottom: 1vh; }
    .now .lines .chart-title small { display: block; font-size: 2vh; font-weight: 400; color: #9a9a9a; }
    .now .lines .chart { columns: 2; column-gap: 3vw; font-size: 2.9vh; font-weight: 700; line-height: 1.35; font-variant-numeric: tabular-nums; }
    .now .lines .chart .cs { break-inside: avoid; margin-bottom: 1.2vh; }
    .now .lines .chart .cs b { display: block; color: #ffd166; font-size: 2.2vh; text-transform: uppercase; letter-spacing: 0.06em; }
    footer { padding: 1.5vh 2vw; background: #3a1d00; color: #ffd166; font-size: 4.5vh; font-weight: 800; text-align: center; }
    footer:empty { display: none; }
    #status { position: fixed; right: 1vw; bottom: 0.5vh; font: 12px system-ui; opacity: 0.4; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous" defer></script>
  <script type="module" src="js/stage.js"></script>
</head>
<body>
  <header>
    <span class="title" id="title">Stage display</span>
    <span class="label" id="label"></span>
    <span class="timer" id="timer" title="Time on this song"></span>
    <span class="clock" id="clock"></span>
  </header>
  <main>
    <section class="now"><h2>Now</h2><div class="lines" id="now"></div><div class="lines2" id="now2"></div></section>
    <section class="next"><h2>Next</h2><div class="lines" id="next"></div></section>
  </main>
  <footer id="message"></footer>
  <div id="status"></div>
</body>
</html>
