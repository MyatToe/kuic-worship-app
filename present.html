<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hangeul.pstatic.net https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://hangeul.pstatic.net; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KUIC Worship — Projector</title>
  <meta name="author" content="Myat Toe (Matthew)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css">
  <link rel="stylesheet" href="css/slides.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
    /* The screen box: the whole window, or a centred 16:9 / 4:3 / 21:9… box (set by present.js) */
    :root { --bw: 100vw; --bh: 100vh; --bl: 0px; --bt: 0px; --fr: 1.7778; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Arial, sans-serif;
      transition: background-color 0.3s;
      cursor: default;
    }
    body.idle { cursor: none; }
    #stage {
      position: absolute;
      top: calc(var(--bt) + var(--bh) * 0.05); bottom: calc(var(--bt) + var(--bh) * 0.09);
      left: calc(var(--bl) + var(--bw) * 0.05); right: calc(var(--bl) + var(--bw) * 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #text {
      text-align: center;
      font-weight: 800;
      line-height: 1.3;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85);
      transition: opacity 0.18s ease;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    #text.fade { opacity: 0; }
    #text { color: var(--text, #fff); }
    body[data-font='nanumsquare'] #text { font-family: 'NanumSquare', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    /* Korean (second language) in the same font, size and weight as the English */
    .t2 { font-size: 1em; font-weight: inherit; margin-top: 0.3em; }
    .s-title { font-size: 0.6em; font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.25em; }
    .h-title { font-size: 1em; font-weight: 500; }
    .h-sub { font-size: 0.7em; font-weight: 400; margin-top: 0.1em; }
    .h-rule { width: 9em; max-width: 60vw; height: 2px; margin: 0.5em auto; background: currentColor; opacity: 0.55; }
    .h-pres { font-size: 0.6em; font-weight: 400; }
    .h-verse { font-size: 0.42em; font-weight: 500; margin: 1.1em auto 0; max-width: 34em; white-space: normal; line-height: 1.45; }
    .h-verse-ko { margin-top: 0.4em; }
    .h-ref { margin-top: 0.4em; font-weight: 300; letter-spacing: 0.04em; }
    body.is-heading #text { text-shadow: none; }
    body.is-deck #text { width: 100%; }
    /* Bible and text slides: Korean nearly as large as English so both can be read from the back */
    body.is-bible .t2 { margin-top: 0.45em; }
    body.is-bible .s-title { font-size: 0.5em; }
    #bgvideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cd-label { font-size: 0.55em; font-weight: 500; }
    .cd-time { font-size: 1.6em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    /* Text style options */
    body.outline #text { -webkit-text-stroke: 0.035em rgba(0, 0, 0, 0.85); paint-order: stroke fill; }
    body.light.outline #text { -webkit-text-stroke: 0.035em rgba(255, 255, 255, 0.9); }
    body.no-shadow #text { text-shadow: none; }
    body[data-align='left'] #text { text-align: left; }
    body[data-align='left'] #stage { justify-content: flex-start; }
    body[data-position='bottom'] #stage { align-items: flex-end; top: calc(var(--bt) + var(--bh) * 0.55); bottom: calc(var(--bt) + var(--bh) * 0.05); }
    body[data-position='top'] #stage { align-items: flex-start; top: calc(var(--bt) + var(--bh) * 0.05); bottom: calc(var(--bt) + var(--bh) * 0.55); }
    /* Text backdrop: a soft band behind the words, for busy photos */
    body[data-backdrop='soft'] #text, body[data-backdrop='strong'] #text { background: rgba(0, 0, 0, 0.45); border-radius: 0.3em; padding: 0.25em 0.6em; }
    body[data-backdrop='strong'] #text { background: rgba(0, 0, 0, 0.65); }
    body.light[data-backdrop='soft'] #text { background: rgba(255, 255, 255, 0.55); }
    body.light[data-backdrop='strong'] #text { background: rgba(255, 255, 255, 0.75); }
    body[data-backdrop] #text:empty { background: none; padding: 0; }
    /* Photos and paintings: a tighter, darker shadow so the words stay sharp */
    body.photo:not(.light):not(.no-shadow) #text { text-shadow: 0 0.04em 0.06em rgba(0, 0, 0, 0.95), 0 3px 16px rgba(0, 0, 0, 0.9); }
    /* Livestream look: lower third over chroma green */
    body[data-look='stream'] { background: #00b140 !important; }
    body[data-look='stream'] #bg, body[data-look='stream'] #dim { display: none; }
    body[data-look='stream'] #stage { top: 68vh; right: 4vw; bottom: 4vh; left: 4vw; }
    body[data-look='stream'] #text { color: #fff; background: rgba(0, 0, 0, 0.72); padding: 0.35em 0.8em; border-radius: 0.3em; text-shadow: none; }
    #footer {
      position: absolute;
      left: calc(var(--bl) + var(--bw) * 0.05);
      right: calc(var(--bl) + var(--bw) * 0.05);
      bottom: calc(var(--bt) + var(--bh) * 0.03);
      font-size: 2.2vh;
      opacity: 0.55;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bg, #dim { position: fixed; top: var(--bt); left: var(--bl); width: var(--bw); height: var(--bh); }
    #dim { background: #000; opacity: 0; transition: opacity 0.4s; }
    #bg { transition: opacity 0.4s; }
    #bg.motion { animation: drift 40s ease-in-out infinite alternate; }
    @keyframes drift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) { #bg.motion { animation: none; } }
    body.light #text { color: var(--text, #111); text-shadow: none; }
    body.light #footer { color: #111; }
    body.light #hint { color: #111; background: rgba(0, 0, 0, 0.08); border-color: rgba(0, 0, 0, 0.3); }
    body.black #stage, body.black #footer, body.black #bg, body.black #dim { visibility: hidden; }
    body.black { background: #000 !important; }
    body.clear #text { opacity: 0; }
    /* Logo screen: church logo (or the church's own logo) over the background */
    #logo { position: absolute; top: var(--bt); left: var(--bl); width: var(--bw); height: var(--bh); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; color: #fff; }
    body.logo #logo { display: flex; }
    body.logo #stage, body.logo #footer { visibility: hidden; }
    #logo .mark { width: 24vh; height: 26vh; background: #aed5de; -webkit-mask: url(img/kuic-church.svg) center / contain no-repeat; mask: url(img/kuic-church.svg) center / contain no-repeat; }
    #logo img { max-width: 50vw; max-height: 45vh; object-fit: contain; display: none; }
    #logo.custom .mark { display: none; }
    #logo.custom img { display: block; }
    #logo.none .mark, #logo.none img { display: none; }
    #logo .name { font-size: 4.2vh; font-weight: 300; letter-spacing: 0.08em; text-align: center; max-width: 80vw; }
    body.light #logo { color: #444166; }
    body.light #logo .mark { background: #444166; }
    #hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font: 15px system-ui, sans-serif;
      transition: opacity 0.4s;
      text-align: center;
    }
    body.fs #hint, body.idle #hint { opacity: 0; pointer-events: none; }
    #status { position: fixed; right: 12px; bottom: 8px; font: 12px system-ui, sans-serif; opacity: 0.4; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous" defer></script>
  <script type="module" src="js/present.js"></script>
</head>
<body>
  <div id="bg"><video id="bgvideo" muted loop playsinline autoplay hidden></video></div>
  <div id="dim"></div>
  <div id="stage"><div id="text"></div></div>
  <div id="logo" aria-hidden="true"><div class="mark"></div><img alt=""><div class="name"></div></div>
  <div id="footer"></div>
  <div id="hint">Click to go full screen · ← → change slide · B black · Esc exits full screen</div>
  <div id="status"></div>
</body>
</html>
